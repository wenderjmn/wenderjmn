<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — EmagreSer</title>
<style>
:root{
  --sidebar:#111827;--sidebar-text:#9ca3af;--sidebar-active:#f9fafb;
  --bg:#f3f4f6;--white:#fff;--border:#e5e7eb;
  --cta:#e8773a;--cta-d:#c4591e;--green:#10b981;--red:#ef4444;
  --text:#111827;--text2:#374151;--text3:#6b7280;
  --r:8px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
button{cursor:pointer;border:none;background:none;font-family:inherit}
input,textarea,select{font-family:inherit}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}

/* LOGIN */
#login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--sidebar)}
.login-card{background:var(--white);border-radius:16px;padding:48px 40px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-logo{font-size:1.5rem;font-weight:700;color:var(--cta);margin-bottom:4px}
.login-sub{font-size:.82rem;color:var(--text3);margin-bottom:32px}
.inp-group{margin-bottom:14px}
.inp-group label{display:block;font-size:.8rem;font-weight:600;color:var(--text2);margin-bottom:5px}
.inp-group input{width:100%;border:1px solid var(--border);border-radius:var(--r);padding:11px 14px;font-size:.92rem;transition:border-color .2s}
.inp-group input:focus{outline:none;border-color:var(--cta)}
.btn-login{width:100%;background:var(--cta);color:#fff;font-weight:700;font-size:.88rem;letter-spacing:.05em;padding:13px;border-radius:var(--r);margin-top:8px;transition:background .2s}
.btn-login:hover{background:var(--cta-d)}
.login-error{color:var(--red);font-size:.8rem;margin-top:10px;text-align:center}

/* LAYOUT */
#app{display:flex;flex:1;min-height:100vh}

/* SIDEBAR */
.sidebar{width:240px;min-width:240px;background:var(--sidebar);color:#fff;display:flex;flex-direction:column;padding:0}
.sidebar-header{padding:24px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-brand{font-size:1.1rem;font-weight:700;color:var(--cta)}
.sidebar-user{font-size:.75rem;color:var(--sidebar-text);margin-top:4px}
.sidebar-nav{flex:1;padding:16px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:.85rem;color:var(--sidebar-text);cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.nav-item:hover{color:var(--sidebar-active);background:rgba(255,255,255,.04)}
.nav-item.active{color:var(--sidebar-active);background:rgba(255,255,255,.06);border-left-color:var(--cta)}
.nav-item-icon{font-size:1rem;width:20px;text-align:center}
.sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08)}
.btn-logout{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--sidebar-text);transition:color .2s;padding:0}
.btn-logout:hover{color:var(--red)}
@media(max-width:768px){.sidebar{width:200px;min-width:200px}}

/* MAIN */
.main{flex:1;overflow:auto;padding:32px}
.page-title{font-size:1.3rem;font-weight:700;margin-bottom:4px}
.page-sub{font-size:.82rem;color:var(--text3);margin-bottom:28px}

/* CARD */
.card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px}
.card-title{font-size:.95rem;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.card-title span{background:rgba(232,119,58,.1);color:var(--cta);padding:2px 8px;border-radius:20px;font-size:.72rem;font-weight:600}

/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}
thead th{text-align:left;padding:10px 12px;background:var(--bg);font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);border-bottom:1px solid var(--border)}
tbody tr{border-bottom:1px solid var(--border)}
tbody tr:last-child{border-bottom:none}
tbody td{padding:10px 12px;vertical-align:top}
.key-cell{font-weight:600;color:var(--text);font-family:monospace;font-size:.8rem;white-space:nowrap}
.val-cell{color:var(--text2);max-width:400px}

/* INLINE EDIT */
.inline-val{cursor:pointer;padding:4px 6px;border-radius:4px;transition:background .15s;white-space:pre-wrap;word-break:break-word;font-size:.83rem;line-height:1.5}
.inline-val:hover{background:rgba(232,119,58,.08)}
.inline-val.editing{display:none}
.inline-input{width:100%;border:1px solid var(--cta);border-radius:4px;padding:6px 8px;font-size:.83rem;font-family:inherit;line-height:1.5;resize:vertical;min-height:36px}
.inline-input:focus{outline:none}
.inline-actions{display:flex;gap:6px;margin-top:4px}
.inline-save{background:var(--cta);color:#fff;font-size:.75rem;font-weight:600;padding:5px 12px;border-radius:4px;transition:background .15s}
.inline-save:hover{background:var(--cta-d)}
.inline-cancel{font-size:.75rem;color:var(--text3);padding:5px 8px;transition:color .15s}
.inline-cancel:hover{color:var(--text)}

/* FORM SECTION */
.field-group{margin-bottom:16px}
.field-group label{display:block;font-size:.8rem;font-weight:600;color:var(--text2);margin-bottom:5px}
.field-group input,.field-group textarea,.field-group select{width:100%;border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;font-size:.88rem;transition:border-color .2s;color:var(--text)}
.field-group input:focus,.field-group textarea:focus{outline:none;border-color:var(--cta)}
.field-group textarea{min-height:100px;resize:vertical;line-height:1.55}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.btn-save{background:var(--cta);color:#fff;font-weight:700;font-size:.82rem;padding:10px 20px;border-radius:var(--r);transition:background .2s}
.btn-save:hover{background:var(--cta-d)}
.btn-save:disabled{opacity:.5;cursor:default}
.btn-danger{background:var(--red);color:#fff;font-weight:700;font-size:.78rem;padding:8px 14px;border-radius:var(--r);transition:opacity .15s}
.btn-danger:hover{opacity:.85}
.btn-add{background:var(--green);color:#fff;font-weight:700;font-size:.82rem;padding:10px 20px;border-radius:var(--r);transition:opacity .15s;margin-bottom:20px}
.btn-add:hover{opacity:.9}

/* STATUS */
.toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:#fff;padding:12px 20px;border-radius:10px;font-size:.85rem;z-index:9999;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none;max-width:300px}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{background:#065f46}
.toast.error{background:#991b1b}

/* DASHBOARD STATS */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
@media(max-width:900px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.stats-grid{grid-template-columns:1fr}}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:20px}
.stat-num{font-size:1.75rem;font-weight:700;color:var(--cta)}
.stat-label{font-size:.78rem;color:var(--text3);margin-top:4px}

/* DISTRIBUTION BAR */
.dist-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dist-label{font-size:.82rem;color:var(--text2);width:200px;flex-shrink:0}
.dist-bar-wrap{flex:1;background:var(--bg);border-radius:4px;height:12px;overflow:hidden}
.dist-bar{height:12px;background:var(--cta);border-radius:4px;transition:width .5s ease}
.dist-pct{font-size:.78rem;font-weight:600;color:var(--text3);width:42px;text-align:right;flex-shrink:0}

/* CTRL ROW para Textos com label */
.ctrl-row{display:grid;grid-template-columns:200px 1fr auto;gap:8px;align-items:start;margin-bottom:12px}
.ctrl-label{font-size:.8rem;color:var(--text2);padding-top:9px;line-height:1.4}
.ctrl-label small{display:block;font-size:.7rem;color:var(--text3);opacity:.65;margin-top:2px}
.ctrl-input{flex:1}
.ctrl-input input,.ctrl-input textarea,.ctrl-input select{width:100%;border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;font-size:.85rem;color:var(--text);background:#fff;transition:border-color .2s}
.ctrl-input input:focus,.ctrl-input textarea:focus{outline:none;border-color:var(--cta)}
.ctrl-input textarea{min-height:68px;resize:vertical;line-height:1.5}
@media(max-width:640px){.ctrl-row{grid-template-columns:1fr}}

/* QUIZ EDITOR */
.q-card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px}
.q-num{font-size:.75rem;font-weight:700;color:var(--cta);margin-bottom:8px}
.q-text-display{font-size:.9rem;font-weight:600;color:var(--text);margin-bottom:12px}
.q-opts-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:500px){.q-opts-grid{grid-template-columns:1fr}}
.q-opt-item{font-size:.8rem;color:var(--text2);background:var(--bg);border-radius:6px;padding:8px 10px;cursor:pointer;transition:background .15s}
.q-opt-item:hover{background:#e5e7eb}
.q-opt-label{font-weight:700;color:var(--text);margin-right:6px}
.btn-edit-q{font-size:.75rem;color:var(--cta);font-weight:600;margin-top:10px;transition:opacity .15s}
.btn-edit-q:hover{opacity:.75}

/* LEADS TABLE */
.lead-sabotador{display:inline-block;background:rgba(232,119,58,.1);color:var(--cta);font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:10px}
.search-bar{width:100%;border:1px solid var(--border);border-radius:var(--r);padding:9px 14px;font-size:.88rem;margin-bottom:16px}
.search-bar:focus{outline:none;border-color:var(--cta)}
</style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="login-page">
  <div class="login-card">
    <div class="login-logo">EmagreSer</div>
    <div class="login-sub">Painel Administrativo</div>
    <div class="inp-group">
      <label>Usuário</label>
      <input type="text" id="login-user" placeholder="admin" autocomplete="username">
    </div>
    <div class="inp-group">
      <label>Senha</label>
      <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn-login" onclick="doLogin()" id="login-btn">Entrar</button>
    <div class="login-error hidden" id="login-error"></div>
  </div>
</div>

<!-- APP LAYOUT -->
<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">EmagreSer</div>
      <div class="sidebar-user" id="sidebar-user">admin</div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav">
      <div class="nav-item active" data-page="dashboard" onclick="goPage('dashboard')"><span class="nav-item-icon">📊</span> Dashboard</div>
      <div class="nav-item" data-page="textos" onclick="goPage('textos')"><span class="nav-item-icon">✏️</span> Textos da LP</div>
      <div class="nav-item" data-page="quiz" onclick="goPage('quiz')"><span class="nav-item-icon">❓</span> Perguntas do Quiz</div>
      <div class="nav-item" data-page="resultados" onclick="goPage('resultados')"><span class="nav-item-icon">🎯</span> Resultados / Perfis</div>
      <div class="nav-item" data-page="depoimentos" onclick="goPage('depoimentos')"><span class="nav-item-icon">🎬</span> Depoimentos</div>
      <div class="nav-item" data-page="mentoras" onclick="goPage('mentoras')"><span class="nav-item-icon">👩</span> Mentoras</div>
      <div class="nav-item" data-page="config" onclick="goPage('config')"><span class="nav-item-icon">⚙️</span> Configurações</div>
      <div class="nav-item" data-page="leads" onclick="goPage('leads')"><span class="nav-item-icon">👥</span> Leads</div>
      <div class="nav-item" data-page="templates" onclick="goPage('templates')"><span class="nav-item-icon">📧</span> Templates E-mail</div>
      <div class="nav-item" data-page="whatsapp" onclick="goPage('whatsapp')"><span class="nav-item-icon">📱</span> WhatsApp</div>
      <div class="nav-item" data-page="wpp_templates" onclick="goPage('wpp_templates')"><span class="nav-item-icon">💬</span> Templates WPP</div>
      <div class="nav-item" data-page="usuarios" onclick="goPage('usuarios')"><span class="nav-item-icon">👤</span> Usuários</div>
    </nav>
    <div class="sidebar-footer">
      <button class="btn-logout" onclick="doLogout()">🚪 Sair</button>
    </div>
  </aside>

  <main class="main" id="main-content">
    <div style="text-align:center;padding:60px;color:var(--text3)">Carregando...</div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://drgrwpmhmrrhxuwxabow.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRyZ3J3cG1obXJyaHh1d3hhYm93Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0Nzg0OTcsImV4cCI6MjA5MzA1NDQ5N30._cjH7sFNaEVNf6cmp4f05x9UE-mfX2RT84BYdhy-9dQ';
const PROXY = 'admin_proxy.php';

let currentUser = null;
let currentPage = 'dashboard';
let allConfig = {};

/* ── AUTH ─────────────────────────── */
async function doLogin() {
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value;
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');
  err.classList.add('hidden');
  btn.textContent = 'Verificando...';
  btn.disabled = true;
  try {
    const fd = new FormData();
    fd.append('action', 'login');
    fd.append('username', user);
    fd.append('password', pass);
    const r = await fetch(PROXY, { method: 'POST', body: fd, credentials: 'same-origin' });
    const data = await r.json();
    if (data.ok) {
      currentUser = data.user;
      document.getElementById('login-page').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      document.getElementById('sidebar-user').textContent = currentUser.username;
      goPage('dashboard');
    } else {
      err.textContent = data.error || 'Credenciais inválidas';
      err.classList.remove('hidden');
    }
  } catch(e) {
    err.textContent = 'Erro de conexão. Verifique se admin_proxy.php está disponível.';
    err.classList.remove('hidden');
  }
  btn.textContent = 'Entrar';
  btn.disabled = false;
}

async function doLogout() {
  const fd = new FormData();
  fd.append('action', 'logout');
  await fetch(PROXY, { method: 'POST', body: fd, credentials: 'same-origin' });
  location.reload();
}

async function checkSession() {
  try {
    const fd = new FormData();
    fd.append('action', 'check');
    const r = await fetch(PROXY, { method: 'POST', body: fd, credentials: 'same-origin' });
    const data = await r.json();
    if (data.ok) {
      currentUser = data.user;
      document.getElementById('login-page').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      document.getElementById('sidebar-user').textContent = currentUser.username;
      goPage('dashboard');
    }
  } catch(e) { /* proxy not available, show login */ }
}

/* ── NAVIGATION ───────────────────── */
function goPage(name) {
  currentPage = name;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === name);
  });
  const pages = { dashboard, textos, quiz: quizPage, resultados, depoimentos, mentoras, config: configPage, leads, templates: emailTemplates, whatsapp: wppPage, wpp_templates: wppTemplatesPage, usuarios: usuariosPage };
  if (pages[name]) pages[name]();
}

/* ── SUPABASE READ ──────────────── */
async function sb(table, params = '') {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${params}`, {
    headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` }
  });
  return r.json();
}

/* ── PROXY WRITE ─────────────────── */
async function proxyWrite(data) {
  const fd = new FormData();
  Object.entries(data).forEach(([k, v]) => fd.append(k, v));
  const r = await fetch(PROXY, { method: 'POST', body: fd, credentials: 'same-origin' });
  return r.json();
}

/* ── PROXY UPLOAD ─────────────────── */
async function proxyUpload(file, bucket, path) {
  const fd = new FormData();
  fd.append('action', 'upload_file');
  fd.append('file', file);
  fd.append('bucket', bucket);
  if (path) fd.append('path', path);
  const r = await fetch(PROXY, { method: 'POST', body: fd, credentials: 'same-origin' });
  return r.json();
}

/* ── TOAST ─────────────────────── */
function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast show ${type}`;
  setTimeout(() => { el.className = 'toast'; }, 3000);
}

/* ── PAGES ─────────────────────── */
const SABOTADOR_NAMES = {
  A: '🍫 A Recompensadora', B: '🤖 Piloto Automático',
  C: '⚡ Prisioneira do Esforço', D: '🌙 Compensadora Noturna'
};

async function dashboard() {
  const main = document.getElementById('main-content');
  main.innerHTML = `<div class="page-title">Dashboard</div><div class="page-sub">Visão geral do Programa EmagreSer</div>
    <div style="text-align:center;padding:40px;color:var(--text3)">Carregando dados…</div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>`;
  try {
    const hdrs = { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}`, Prefer: 'count=exact' };
    const [rAll, rToday, rCfg, rLeadsRecent] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/leads?select=id&limit=1`, {headers: hdrs}),
      fetch(`${SUPABASE_URL}/rest/v1/leads?select=id&limit=1&created_at=gte.${new Date().toISOString().slice(0,10)}`, {headers: hdrs}),
      sb('site_config', 'select=key,value&limit=500'),
      sb('leads', 'select=id,name,email,sabotador,created_at&order=created_at.desc&limit=10'),
    ]);
    const totalLeads = parseInt((rAll.headers.get('content-range')||'0/0').split('/')[1]) || 0;
    const todayLeads = parseInt((rToday.headers.get('content-range')||'0/0').split('/')[1]) || 0;
    rCfg.forEach(r => { allConfig[r.key] = r.value; });
    const masterclass = allConfig['masterclass_data'] || allConfig['live_data'] || '—';

    // Load all leads for distribution chart (500 limit to be safe)
    const allLeadsForChart = await sb('leads', 'select=sabotador&limit=1000');
    const dist = {A:0,B:0,C:0,D:0};
    allLeadsForChart.forEach(l => {
      const s = (l.sabotador||'').trim().toUpperCase();
      if (dist[s] !== undefined) dist[s]++;
      else if (/Recompensadora|Hedônica/i.test(l.sabotador)) dist.A++;
      else if (/Piloto|Amn/i.test(l.sabotador)) dist.B++;
      else if (/Prisioneira|Fadiga/i.test(l.sabotador)) dist.C++;
      else if (/Compensadora|Restri/i.test(l.sabotador)) dist.D++;
    });
    const distTotal = Object.values(dist).reduce((a,b)=>a+b,0) || 1;
    const topSab = Object.entries(dist).sort((a,b)=>b[1]-a[1])[0];
    const topName = topSab ? (SABOTADOR_NAMES[topSab[0]] || topSab[0]) : '—';

    main.innerHTML = `
      <div class="page-title">Dashboard</div>
      <div class="page-sub">Visão geral do Programa EmagreSer</div>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-num">${totalLeads}</div><div class="stat-label">Total de leads</div></div>
        <div class="stat-card"><div class="stat-num">${todayLeads}</div><div class="stat-label">Leads hoje</div></div>
        <div class="stat-card" style="overflow:hidden"><div class="stat-num" style="font-size:1rem;margin-top:4px">${topName}</div><div class="stat-label">Perfil mais comum</div></div>
        <div class="stat-card"><div class="stat-num" style="font-size:1.1rem">📅</div><div class="stat-label">Masterclass: ${escHtml(masterclass)}</div></div>
      </div>
      <div class="card">
        <div class="card-title">Distribuição por perfil sabotador <span>${allLeadsForChart.length} leads</span></div>
        ${Object.entries(dist).map(([k,v]) => {
          const pct = Math.round(v/distTotal*100);
          return `<div class="dist-row">
            <div class="dist-label">${SABOTADOR_NAMES[k]}</div>
            <div class="dist-bar-wrap"><div class="dist-bar" style="width:${pct}%"></div></div>
            <div class="dist-pct">${v} <span style="color:var(--text3);font-weight:400">(${pct}%)</span></div>
          </div>`;
        }).join('')}
      </div>
      <div class="card">
        <div class="card-title">Últimos 10 leads</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Data</th></tr></thead>
            <tbody>
              ${rLeadsRecent.map(l => `
                <tr>
                  <td style="font-weight:600;font-size:.85rem">${escHtml(l.name||'—')}</td>
                  <td style="font-size:.8rem;color:var(--text2)">${escHtml(l.email||'—')}</td>
                  <td><span class="lead-sabotador">${escHtml(l.sabotador||'—')}</span></td>
                  <td style="font-size:.78rem;color:var(--text3)">${l.created_at ? new Date(l.created_at).toLocaleString('pt-BR') : '—'}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
  } catch(e) {

async function textos() {

  main.innerHTML = `<div class="page-title">Textos da Landing Page</div><div class="page-sub">Edite os textos exibidos na home. Cada campo tem seu nome amigável. Salva direto no banco ao clicar em Salvar.</div><div id="textos-body"><div style="text-align:center;padding:40px;color:var(--text3)">Carregando…</div></div>`;
  const rows = await sb('site_config', 'select=key,value&limit=500');
  const cfgMap = {};
  rows.forEach(r => { cfgMap[r.key] = r.value; allConfig[r.key] = r.value; });

  let html = '';
  TEXTOS_SECTIONS.forEach(sec => {
    html += `<div class="card"><div class="card-title">${sec.title}</div>
      ${sec.fields.map(f => {
        const val = cfgMap[f.key] || '';
        const id = `txt-${f.key}`;
        const input = f.type === 'textarea'
          ? `<textarea id="${id}" rows="3">${escHtml(val)}</textarea>`
          : `<input type="text" id="${id}" value="${escHtml(val)}">`;
        return `<div class="ctrl-row">
          <div class="ctrl-label">${escHtml(f.label)}<small>${f.key}</small></div>
          <div class="ctrl-input">${input}</div>
          <button class="btn-save" style="padding:8px 14px;font-size:.78rem;white-space:nowrap" onclick="saveTxt('${f.key}')">Salvar</button>

}

async function saveTxt(key) {
  const el = document.getElementById(`txt-${key}`);
  if (!el) return;
  try {
    const res = await proxyWrite({ action: 'update_config', key, value: el.value });
    if (res.ok) { allConfig[key] = el.value; toast('Salvo!'); }
    else toast(res.error || 'Erro ao salvar', 'error');
  } catch(e) { toast('Erro de conexão', 'error'); }
}

function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function setPhotoPos(id, pos) {
  document.getElementById(`mf-pos-${id}`).value = pos;
  const preview = document.getElementById(`mf-preview-${id}`);
  if (preview) preview.style.objectPosition = `center ${pos}`;
  ['top','center','bottom'].forEach(v => {
    const btn = document.getElementById(`mf-pos-btn-${id}-${v}`);
    const active = v === pos;
    btn.style.borderColor = active ? 'var(--teal)' : 'var(--border)';
    btn.style.background  = active ? 'var(--teal)' : 'transparent';
    btn.style.color       = active ? '#fff' : 'var(--text)';
  });
}

function updatePhotoPreview(id) {
  const url = document.getElementById(`mf-photo-${id}`).value;
  const img = document.getElementById(`mf-preview-${id}`);
  const noImg = document.getElementById(`mf-noimg-${id}`);
  if (url) {
    img.src = url;
    img.style.display = 'block';
    noImg.style.display = 'none';
  } else {
    img.style.display = 'none';
    noImg.style.display = 'flex';
  }
}

async function uploadMentoraPhoto(input, id) {
  const file = input.files[0];
  if (!file) return;

async function uploadAsset(input, path, configKey, previewId) {
  const file = input.files[0];
  if (!file) return;
  const statusId = configKey.replace('_url','') + '-upload-status';
  const status = document.getElementById(statusId);
  if (status) status.textContent = 'Enviando…';
  try {
    const res = await proxyUpload(file, 'assets', path);
    if (res.ok) {
      // Save URL to site_config
      await proxyWrite({ action: 'update_config', key: configKey, value: res.url });
      const prev = document.getElementById(previewId);
      if (prev) { prev.src = res.url; prev.style.display = 'block'; }
      if (status) { status.textContent = '✅ Enviado!'; setTimeout(()=>{status.textContent=''},3500); }
      toast('Logo enviada e salva!');
    } else {
      if (status) status.textContent = '❌ ' + (res.error || 'Erro');
      toast(res.error || 'Erro no upload', 'error');
    }
  } catch(e) {
    if (status) status.textContent = '❌ Erro de conexão';
    toast('Erro de conexão', 'error');
  }
  input.value = '';
}

function renderLeadsDist(rows) {
  const el = document.getElementById('leads-dist');

  const dist = {A:0,B:0,C:0,D:0};
  rows.forEach(l => {
    const s = (l.sabotador||'').trim().toUpperCase();
    if (dist[s] !== undefined) dist[s]++;
    else if (/Recompensadora/i.test(l.sabotador)) dist.A++;
    else if (/Piloto/i.test(l.sabotador)) dist.B++;
    else if (/Prisioneira/i.test(l.sabotador)) dist.C++;
    else if (/Compensadora/i.test(l.sabotador)) dist.D++;
  });
  const total = rows.length || 1;
  el.innerHTML = `<div class="card" style="margin-bottom:0">
    <div class="card-title" style="margin-bottom:12px">Distribuição por perfil <span>${rows.length} leads</span></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px">
      ${Object.entries(dist).map(([k,v]) => {
        const pct = Math.round(v/total*100);
        return `<div style="background:var(--bg);border-radius:8px;padding:12px">
          <div style="font-size:.75rem;color:var(--text3);margin-bottom:4px">${SABOTADOR_NAMES[k]||k}</div>

          <div style="margin-top:6px;background:#e5e7eb;border-radius:4px;height:6px;overflow:hidden">
            <div style="height:6px;width:${pct}%;background:var(--cta);border-radius:4px"></div>

      }).join('')}

}

  document.getElementById('leads-body').innerHTML = `

        <thead><tr><th>Nome</th><th>E-mail</th><th>WhatsApp</th><th>Perfil</th><th>Faixa Etária</th><th>Renda</th><th>Cidade/UF</th><th>Origem</th><th>Data</th></tr></thead>

            const med = l.utm_medium || null;
            const srcIcons = {'instagram':'📸','facebook':'📘','google':'🔍','whatsapp':'💬','youtube':'▶️'};
            const icon = src ? (srcIcons[src.toLowerCase()] || '🌐') : '🌐';
            return `
            <tr>
              <td style="font-weight:600;font-size:.85rem">${escHtml(l.name||'')}</td>
              <td style="font-size:.8rem;word-break:break-all">${escHtml(l.email||'')}</td>
              <td style="font-size:.8rem">${escHtml(l.phone||'')}</td>
              <td><span class="lead-sabotador">${escHtml(l.sabotador||'—')}</span></td>
              <td style="font-size:.78rem;color:var(--text2)">${escHtml(l.faixa_etaria||'—')}</td>
              <td style="font-size:.78rem;color:var(--text2)">${escHtml(l.faixa_renda||'—')}</td>

    </div>`;

function filterLeads(q) {
  if (!window._allLeads) return;
  const lq = q.toLowerCase();
  const sabFilter = document.getElementById('lead-filter-sab')?.value || '';
  const filtered = window._allLeads.filter(l => {
    const matchQ = !lq || (l.name||'').toLowerCase().includes(lq) ||
      (l.email||'').toLowerCase().includes(lq) ||
      (l.sabotador||'').toLowerCase().includes(lq) ||
      (l.phone||'').includes(lq);
    const matchSab = !sabFilter || (l.sabotador||'').trim().toUpperCase() === sabFilter;
    return matchQ && matchSab;
  });
  renderLeads(filtered);
}

function exportLeads() {
  const rows = window._allLeads;
  if (!rows || !rows.length) { toast('Nenhum lead para exportar', 'error'); return; }
  const headers = ['nome','email','telefone','faixa_etaria','faixa_renda','cidade','estado','sabotador','origem','data'];
  const csvRows = rows.map(l => [
    l.name||'', l.email||'', l.phone||'',
    l.faixa_etaria||'', l.faixa_renda||'',
    l.cidade||'', l.estado||'', l.sabotador||'',
    l.source||'', l.created_at ? new Date(l.created_at).toLocaleString('pt-BR') : ''
  ].map(v => `"${String(v).replace(/"/g,'""')}"`).join(','));
  const csv = '﻿' + headers.join(',') + '\n' + csvRows.join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `leads-emagreser-${new Date().toISOString().slice(0,10)}.csv`; a.click();
}

async function tplLoadList() {

async function tplLoad(slug) {
  window._tplActive = slug;
  document.querySelectorAll('#tpl-list > div').forEach(el => el.style.background = '');
  const item = document.getElementById('tpl-item-' + slug.replace(/[^a-z0-9]/g,'_'));
  if (item) item.style.background = '#fff7ed';

  const r = await proxyWrite({ action: 'get_email_template', slug });
  if (!r.ok || !r.data) { toast('Erro ao carregar template', 'error'); return; }
  const t = r.data;

  /* Show topbar, hide empty state */
  const topbar = document.getElementById('tpl-topbar');
  const empty  = document.getElementById('tpl-empty');
  if (topbar) topbar.style.display = 'block';
  if (empty)  empty.style.display  = 'none';

  /* Populate topbar fields */
  const slugDisplay = document.getElementById('tpl-slug-display');
  const subjectEl   = document.getElementById('tpl-subject');
  const bodyEl      = document.getElementById('tpl-body');
  const applyBtn    = document.getElementById('tpl-apply-btn');
  const statusEl    = document.getElementById('tpl-edit-status');
  if (slugDisplay) slugDisplay.textContent = t.slug;
  if (subjectEl)  subjectEl.value = t.subject;
  if (bodyEl)     bodyEl.value    = t.body_html;
  if (applyBtn)   applyBtn.style.display = 'none';
  if (statusEl)   statusEl.textContent   = '';

  /* Auto-open preview */
  tplPreview();
}

/* Placeholder values used when rendering preview */
const TPL_PREVIEW_VARS = {
  '{{nome}}': 'Maria',
  '{{link_wpp}}': '#',
  '{{link_descadastro}}': '#',
  '{{link_site}}': '#',
  '{{emoji}}': '🍫',
  '{{tipo}}': 'Perfil A — A Recompensadora',
  '{{titulo}}': 'Você usa a comida como prêmio e alívio emocional',
};

/* Reverse map: preview placeholder text → original variable */
const TPL_REVERSE_VARS = Object.fromEntries(
  Object.entries(TPL_PREVIEW_VARS).map(([k,v]) => [v, k])
);

let _tplObserver = null;

function tplPreview() {
  const textarea = document.getElementById('tpl-body');
  if (!textarea) return;
  const html = textarea.value;
  if (!html) { toast('Sem HTML para visualizar', 'error'); return; }

  let rendered = html;
  Object.entries(TPL_PREVIEW_VARS).forEach(([k,v]) => {
    rendered = rendered.split(k).join(v);
  });

  /* Inject contenteditable + edit styles */
  const editStyle = `<style>
    [contenteditable]:hover{outline:2px dashed #e8773a;outline-offset:2px;cursor:text}
    [contenteditable]:focus{outline:2px solid #e8773a;outline-offset:2px}
    body{cursor:default}
  </style>`;
  rendered = rendered.replace('</head>', editStyle + '</head>');

  const panel = document.getElementById('tpl-preview-panel');
  const frame = document.getElementById('tpl-preview-frame');
  if (!panel || !frame) {
    const w = window.open('', '_blank');
    w.document.write(rendered); w.document.close();
    return;
  }

  panel.style.display = 'block';

  /* Disconnect previous observer before reloading */
  if (_tplObserver) { _tplObserver.disconnect(); _tplObserver = null; }

  frame.srcdoc = rendered;

  /* Wait for iframe to load, then make body editable and watch changes */
  frame.onload = () => {
    const doc = frame.contentDocument;
    if (!doc) return;
    doc.body.contentEditable = 'true';
    doc.body.spellcheck = false;
    doc.designMode = 'off'; /* contenteditable on body is enough */

    const status = document.getElementById('tpl-edit-status');
    _tplObserver = new MutationObserver(() => {
      const st = document.getElementById('tpl-edit-status');
      const btn = document.getElementById('tpl-apply-btn');
      if (st)  { st.textContent = '● Edições pendentes'; st.style.color = '#e8773a'; }
      if (btn) btn.style.display = 'inline-block';
    });
    _tplObserver.observe(doc.body, { childList: true, subtree: true, characterData: true });
  };

  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* Read edited HTML from iframe, reverse-substitute preview values back to {{variables}}, update textarea */
function tplSyncFromPreview() {
  const frame = document.getElementById('tpl-preview-frame');
  const textarea = document.getElementById('tpl-body');
  if (!frame || !textarea) return;
  const doc = frame.contentDocument;
  if (!doc) { toast('Abra o preview primeiro', 'error'); return; }

  /* Temporarily disable editing to get clean HTML */
  doc.body.contentEditable = 'false';
  let html = doc.documentElement.outerHTML;
  doc.body.contentEditable = 'true';

  /* Remove the injected edit styles */
  html = html.replace(/<style>\s*\[contenteditable\][^<]*<\/style>/g, '');

  /* Reverse-substitute preview placeholder text back to variables */
  Object.entries(TPL_REVERSE_VARS).forEach(([v, k]) => {
    html = html.split(v).join(k);
  });

  textarea.value = html;
  const status = document.getElementById('tpl-edit-status');
  const applyBtn = document.getElementById('tpl-apply-btn');
  if (status) { status.textContent = '✅ Pronto — clique em Salvar'; status.style.color = '#16a34a'; setTimeout(()=>{ status.textContent=''; }, 4000); }
  if (applyBtn) applyBtn.style.display = 'none';
  toast('Edições aplicadas! Clique em 💾 Salvar para gravar.');
}

function tplAutoPreview() {
  const panel = document.getElementById('tpl-preview-panel');
  if (!panel || panel.style.display === 'none') return;
  tplPreview();
}

async function toggleActive(id, active) {
  const r = await proxyWrite({ action: 'toggle_user', id, active: active ? '1' : '0' });
  if (r.ok) { toast(active ? 'Usuário ativado!' : 'Usuário desativado.'); await loadUsers(); }
  else toast(r.error || 'Erro', 'error');
}

async function deleteUser(id, username) {
  if (!confirm(`Excluir o usuário "${username}" permanentemente? Essa ação não pode ser desfeita.`)) return;
  const r = await proxyWrite({ action: 'delete_user', id });
  if (r.ok) { toast('Usuário excluído.'); await loadUsers(); }
  else toast(r.error || 'Erro ao excluir', 'error');
}

/* ── WHATSAPP QUEUE ──────────────────────────────────────────────── */
async function wppPage() {
  const main = document.getElementById('main-content');
  main.innerHTML = `
    <div class="page-title">WhatsApp — Fila de Mensagens</div>
    <div class="page-sub">Acompanhe os envios, desbloqueie mensagens travadas e reenvie falhas.</div>
    <div id="wpp-body"><div style="text-align:center;padding:40px;color:var(--text3)">Carregando…</div></div>`;
  await wppLoad();
}

async function wppLoad() {
  const r = await proxyWrite({ action: 'wpp_stats' });
  const el = document.getElementById('wpp-body');
  if (!r.ok) { el.innerHTML = `<div class="card" style="color:var(--red)">Erro ao carregar fila: ${escHtml(r.error||'')}</div>`; return; }

  const c = r.counts || {};
  const total = (c.pending||0) + (c.processing||0) + (c.sent||0) + (c.failed||0);

  el.innerHTML = `
    <!-- Stats -->
    <div class="stats-grid" style="grid-template-columns:repeat(5,1fr)">
      <div class="stat-card"><div class="stat-num">${c.sent||0}</div><div class="stat-label">📤 Enviadas</div></div>
      <div class="stat-card"><div class="stat-num" style="color:#065f46">${c.read||0}</div><div class="stat-label">👁 Lidas</div></div>
      <div class="stat-card"><div class="stat-num" style="color:#1e40af">${c.delivered||0}</div><div class="stat-label">✅ Entregues</div></div>
      <div class="stat-card"><div class="stat-num">${c.pending||0}</div><div class="stat-label">⏳ Pendentes</div></div>
      <div class="stat-card"><div class="stat-num" style="color:${(c.failed||0)>0?'var(--red)':'var(--cta)'}">${c.failed||0}</div><div class="stat-label">❌ Falhas</div></div>
    </div>

    <!-- Ações -->
    <div class="card" style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:16px 20px">
      <span style="font-size:.85rem;color:var(--text2);font-weight:600">Ações da fila:</span>
      <button onclick="wppResetStuck()" style="background:#fff7ed;border:1px solid #fed7aa;color:#c2410c;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;font-weight:600"
        title="Desbloqueia mensagens travadas em 'processando' e as coloca de volta na fila">
        🔓 Desbloquear travadas ${c.processing ? `(${c.processing})` : ''}
      </button>
      <button onclick="wppRetryFailed()" style="background:#fef2f2;border:1px solid #fecaca;color:#dc2626;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;font-weight:600"
        title="Recoloca todas as mensagens com falha na fila para reenvio">
        🔁 Reenviar falhas ${c.failed ? `(${c.failed})` : ''}
      </button>
      <button onclick="wppLoad()" style="background:#f3f4f6;border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer">
        ↻ Atualizar
      </button>
      <span style="font-size:.78rem;color:var(--text3);margin-left:auto">${total} mensagens no total</span>
    </div>

    <!-- Fila pendente/falha -->
    ${(r.queue||[]).length ? `
    <div class="card">
      <div class="card-title">📋 Fila (pendentes, falhas, em processamento) <span>${(r.queue||[]).length}</span></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Lead</th><th>Telefone</th><th>Mensagem</th><th>Status</th><th>Agendado para</th><th>Tentativas</th><th></th></tr></thead>
        <tbody>
          ${(r.queue||[]).map(m => {
            const statusColor = {pending:'#6b7280', processing:'#f59e0b', failed:'#ef4444'};
            const statusLabel = {pending:'⏳ Pendente', processing:'🔄 Processando', failed:'❌ Falha'};
            const isOverdue = m.status === 'pending' && m.scheduled_at && new Date(m.scheduled_at) < new Date();
            return `<tr>
              <td style="font-weight:600;font-size:.85rem">${escHtml(m.to_name||'—')}</td>
              <td style="font-size:.8rem;color:var(--text3)">${escHtml(m.to_phone||'')}</td>
              <td style="font-size:.78rem;color:var(--text2);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml((m.message||'').slice(0,120))}${(m.message||'').length>120?'…':''}</td>
              <td><span style="font-size:.75rem;font-weight:600;color:${statusColor[m.status]||'#6b7280'}">${statusLabel[m.status]||m.status}</span>${m.error_msg?`<br><span style="font-size:.7rem;color:var(--red)">${escHtml(m.error_msg.slice(0,60))}</span>`:''}</td>
              <td style="font-size:.78rem;color:${isOverdue?'var(--red)':'var(--text3)'}${isOverdue?';font-weight:600':''}">${m.scheduled_at ? new Date(m.scheduled_at).toLocaleString('pt-BR') : '—'}${isOverdue?' ⚠️':''}</td>
              <td style="font-size:.8rem;text-align:center">${m.attempts||0}</td>
              <td><button onclick="wppCancel('${m.id}')" style="font-size:.72rem;color:var(--red);background:none;border:none;cursor:pointer;padding:4px" title="Cancelar esta mensagem">✕</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table></div>
    </div>` : `<div class="card" style="color:var(--text3);text-align:center;padding:24px">Nenhuma mensagem pendente na fila 🎉</div>`}

    <!-- Log de enviadas -->
    <div class="card">
      <div class="card-title">✅ Histórico de enviadas <span>${(r.sent||[]).length}</span></div>
      ${(r.sent||[]).length ? `
      <div class="table-wrap"><table>
        <thead><tr><th>Lead</th><th>Telefone</th><th>Mensagem</th><th>Enviado em</th><th>Confirmação</th></tr></thead>
        <tbody>
          ${(r.sent||[]).map(m => {
            const ds = (m.delivery_status||'').toLowerCase();
            let badge = '';
            if (m.read_at || ds === 'read' || ds === 'played') {
              badge = `<span title="Lido em ${m.read_at ? new Date(m.read_at).toLocaleString('pt-BR') : ''}" style="display:inline-flex;align-items:center;gap:3px;background:#d1fae5;color:#065f46;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:20px">👁 Lido</span>`;
            } else if (m.delivered_at || ds === 'received') {
              badge = `<span title="Entregue em ${m.delivered_at ? new Date(m.delivered_at).toLocaleString('pt-BR') : ''}" style="display:inline-flex;align-items:center;gap:3px;background:#dbeafe;color:#1e40af;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:20px">✅ Entregue</span>`;
            } else if (ds === 'sent' || m.zapi_message_id) {
              badge = `<span style="display:inline-flex;align-items:center;gap:3px;background:#f3f4f6;color:#6b7280;font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:20px">📤 Enviado</span>`;
            } else {
              badge = `<span style="font-size:.7rem;color:var(--text3)">—</span>`;
            }
            return `<tr>
              <td style="font-weight:600;font-size:.85rem">${escHtml(m.to_name||'—')}</td>
              <td style="font-size:.8rem;color:var(--text3)">${escHtml(m.to_phone||'')}</td>
              <td style="font-size:.78rem;color:var(--text2);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml((m.message||'').slice(0,120))}${(m.message||'').length>120?'…':''}</td>
              <td style="font-size:.78rem;color:var(--text3);white-space:nowrap">${m.sent_at ? new Date(m.sent_at).toLocaleString('pt-BR') : '—'}</td>
              <td style="white-space:nowrap">${badge}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table></div>` : `<p style="color:var(--text3);font-size:.85rem">Nenhuma mensagem enviada ainda.</p>`}
    </div>`;
}

async function wppResetStuck() {
  const r = await proxyWrite({ action: 'wpp_reset_stuck' });
  if (r.ok) {
    toast(r.affected > 0 ? `${r.affected} mensagem(ns) desbloqueada(s)!` : 'Nenhuma mensagem travada.');
    await wppLoad();
  } else toast('Erro: ' + (r.error||''), 'error');
}

async function wppRetryFailed() {
  const r = await proxyWrite({ action: 'wpp_retry_failed' });
  if (r.ok) {
    toast(r.affected > 0 ? `${r.affected} mensagem(ns) reenfileirada(s)!` : 'Nenhuma falha para reenviar.');
    await wppLoad();
  } else toast('Erro: ' + (r.error||''), 'error');
}

async function wppCancel(id) {
  if (!confirm('Cancelar esta mensagem? Ela será removida da fila permanentemente.')) return;
  const r = await proxyWrite({ action: 'wpp_cancel_msg', id });
  if (r.ok) { toast('Mensagem cancelada.'); await wppLoad(); }
  else toast('Erro ao cancelar: ' + (r.error||''), 'error');
}

let _wptActive = null;

async function wptLoadList() {
  const r = await proxyWrite({ action: 'list_wpp_templates' });
  const list = document.getElementById('wpt-list');
  if (!list) return;
  if (!r.ok || !r.data?.length) { list.innerHTML = '<p style="padding:12px;color:#9ca3af;font-size:13px">Nenhum template</p>'; return; }
  list.innerHTML = r.data.map(t => `
    <div onclick="wptLoad(${t.id})" id="wpt-item-${t.id}"
      style="padding:10px 14px;border-radius:8px;cursor:pointer;margin-bottom:4px;transition:background .15s;opacity:${t.active?1:.5}"
      onmouseover="this.style.background='#f4f3ef'" onmouseout="this.style.background=_wptActive===${t.id}?'#f0fdfa':''">
      <div style="font-size:13px;font-weight:600;color:#1c1917">${escHtml(t.name)}</div>
      <div style="font-size:11px;font-family:monospace;color:#6b7280;margin-top:2px">${escHtml(t.slug)}</div>
      <div style="font-size:11px;color:${t.active?'var(--green)':'var(--text3)'};margin-top:2px">${t.active?'● Ativo':'○ Inativo'}</div>
    </div>`).join('');
}

async function wptLoad(id) {
  _wptActive = id;
  document.querySelectorAll('#wpt-list > div').forEach(el => el.style.background = '');
  const item = document.getElementById('wpt-item-' + id);
  if (item) item.style.background = '#fff7ed';

  const r = await proxyWrite({ action: 'get_wpp_template', id });
  if (!r.ok || !r.data) { toast('Erro ao carregar template', 'error'); return; }
  const t = r.data;

  document.getElementById('wpt-new-form').style.display = 'none';
  document.getElementById('wpt-empty').style.display = 'none';
  const form = document.getElementById('wpt-form');
  form.style.display = 'block';

  document.getElementById('wpt-id').value        = t.id;
  document.getElementById('wpt-slug-display').textContent = t.slug;
  document.getElementById('wpt-slug').value      = t.slug;
  document.getElementById('wpt-name').value      = t.name;
  document.getElementById('wpt-message').value   = t.message;

  const toggleBtn = document.getElementById('wpt-toggle-btn');
  if (toggleBtn) {
    toggleBtn.textContent  = t.active ? '⏸ Desativar' : '▶ Ativar';
    toggleBtn.style.background = t.active ? '#fef2f2' : '#f0fdf4';
    toggleBtn.style.color      = t.active ? '#dc2626'  : '#16a34a';
    toggleBtn.style.borderColor= t.active ? '#fecaca'  : '#bbf7d0';
    toggleBtn.dataset.active   = t.active ? '1' : '0';
  }

  wptUpdatePreview();
}

function wptUpdatePreview() {
  const msg = document.getElementById('wpt-message')?.value || '';
  const preview = document.getElementById('wpt-preview');
  if (!preview) return;
  const rendered = msg
    .replace(/\{\{nome\}\}/g, 'Maria')
    .replace(/\{\{link_wpp\}\}/g, 'https://chat.whatsapp.com/…')
    .replace(/\{\{link_site\}\}/g, 'https://www.oficialemagreser.com')
    .replace(/\{\{link_descadastro\}\}/g, 'https://www.oficialemagreser.com/descadastro');
  preview.textContent = rendered;
}

function wptNew() {
  _wptActive = null;
  document.querySelectorAll('#wpt-list > div').forEach(el => el.style.background = '');
  document.getElementById('wpt-form').style.display = 'none';
  document.getElementById('wpt-empty').style.display = 'none';
  document.getElementById('wpt-new-form').style.display = 'block';
  document.getElementById('wpt-new-name').value = '';
  document.getElementById('wpt-new-slug').value = '';
  document.getElementById('wpt-new-message').value = '';
}

function wptAutoSlug() {
  const name = document.getElementById('wpt-new-name')?.value || '';
  const slug = name.toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
  const slugEl = document.getElementById('wpt-new-slug');
  if (slugEl) slugEl.value = slug;
}

async function wptCreate() {
  const name    = document.getElementById('wpt-new-name')?.value?.trim();
  const slug    = document.getElementById('wpt-new-slug')?.value?.trim();
  const message = document.getElementById('wpt-new-message')?.value;
  if (!name)    { toast('Nome obrigatório', 'error'); return; }
  if (!message) { toast('Mensagem obrigatória', 'error'); return; }
  const r = await proxyWrite({ action: 'save_wpp_template', name, slug: slug||name.toLowerCase().replace(/\s+/g,'_'), message });
  if (r.ok) { toast('Template criado!'); await wptLoadList(); document.getElementById('wpt-new-form').style.display = 'none'; document.getElementById('wpt-empty').style.display = 'block'; }
  else toast('Erro ao criar: ' + (r.error||''), 'error');
}

async function wptSave() {
  const id      = document.getElementById('wpt-id')?.value;
  const name    = document.getElementById('wpt-name')?.value?.trim();
  const slug    = document.getElementById('wpt-slug')?.value?.trim();
  const message = document.getElementById('wpt-message')?.value;
  if (!name)    { toast('Nome obrigatório', 'error'); return; }
  if (!message) { toast('Mensagem obrigatória', 'error'); return; }
  const r = await proxyWrite({ action: 'save_wpp_template', id, name, slug, message });
  if (r.ok) { toast('Template salvo!'); await wptLoadList(); }
  else toast('Erro ao salvar: ' + (r.error||''), 'error');
}

async function wptToggle() {
  const id  = document.getElementById('wpt-id')?.value;
  const btn = document.getElementById('wpt-toggle-btn');
  const isActive = btn?.dataset.active === '1';
  const r = await proxyWrite({ action: 'toggle_wpp_template', id, active: isActive ? '0' : '1' });
  if (r.ok) { toast(isActive ? 'Template desativado.' : 'Template ativado!'); await wptLoadList(); await wptLoad(parseInt(id)); }
  else toast('Erro: ' + (r.error||''), 'error');
}

async function wptDelete() {
  const id   = document.getElementById('wpt-id')?.value;
  const name = document.getElementById('wpt-name')?.value;
  if (!confirm(`Excluir o template "${name}"? Essa ação não pode ser desfeita.`)) return;
  const r = await proxyWrite({ action: 'delete_wpp_template', id });
  if (r.ok) {
    toast('Template excluído.');
    _wptActive = null;
    await wptLoadList();
    document.getElementById('wpt-form').style.display = 'none';
    document.getElementById('wpt-empty').style.display = 'block';
  } else toast('Erro ao excluir: ' + (r.error||''), 'error');
}
